<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت Gandom</title>
</head>
<body>
    <h2>پنل مدیریت</h2>
    <div>
        <label for="price">قیمت (تومان):</label>
        <input type="number" id="price" inputmode="decimal" step="0.01" placeholder="قیمت (تومان)">
    </div>
    <div>
        <label for="amount">تعداد:</label>
        <input type="number" id="amount" inputmode="numeric" placeholder="تعداد را وارد کنید">
    </div>
</body>
</html>
