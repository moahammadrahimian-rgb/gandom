function makeCurl(x) {
    const g = new THREE.Group();
    for (let i = 0; i < 6; i++) {
        const r = 0.06 - i * 0.007;
        const seg = new THREE.Mesh(
            new THREE.SphereGeometry(r, 14, 14),
            i % 2 === 0 ? hairDark : hairLight
        );
        seg.position.y = -i * 0.13;
        seg.position.z = Math.sin(i * 0.9) * 0.03;
        seg.position.x = Math.cos(i * 0.7) * 0.01;
        seg.scale.set(1, 1.05, 0.85);
        g.add(seg);
    }
    g.position.set(x, 1.16, 0.05);
    return g;
}

// ═══════════════════════════════════════════════
// 💫 ستاره‌ها و هاله

const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 200; i++) {

    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    starPos.push(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th)+1, r*Math.cos(ph));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));

// ═══════════════════════════════════════════════
// 🎭 متحرک‌سازی
// ═══════════════════════════════════════════════
const clock = new THREE.Clock();
let isSpeaking = false;
let blinkTimer = 0;
let nextBlink = 3;

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const dt = clock.getDelta();

    // شناور
    gandom.position.y = Math.sin(t * 1.1) * 0.02;

    // تنفس
    const br = Math.sin(t * 2.2) * 0.007;
    torso.scale.set(1 + br, 1, 1 + br);

    // چرخش آرام سر
    head.rotation.y = Math.sin(t * 0.5) * 0.08;
    jaw.rotation.y = head.rotation.y;
    eyeL.rotation.y = head.rotation.y;
    eyeR.rotation.y = head.rotation.y;
    bangs.rotation.y = head.rotation.y;

    // پلک زدن
    blinkTimer += dt;
    if (blinkTimer > nextBlink) {
        const bp = Math.min(1, (blinkTimer - nextBlink) * 8);
        const close = Math.sin(bp * Math.PI) * 0.025;
        eyeL.position.y = 1.275 - close;
        eyeR.position.y = 1.275 - close;
        if (bp >= 1) {
            blinkTimer = 0;
            nextBlink = 2.5 + Math.random() * 3;
            eyeL.position.y = 1.275;
            eyeR.position.y = 1.275;
        }
    }

    // حرکت لب
    if (isSpeaking) {
        const m = Math.abs(Math.sin(t * 9)) * 0.5;
        lipLower.position.y = 1.19 - m * 0.01;
        lipUpper.position.y = 1.198 + m * 0.003;
        lipLower.scale.set(1 + m * 0.2, 1, 1);
    } else {
        lipLower.position.y = 1.19;
        lipUpper.position.y = 1.198;
        lipLower.scale.set(1, 1, 1);
    }

    // گیسوها
    curlL.rotation.z = Math.sin(t * 1.3) * 0.05 + 0.05;
    curlR.rotation.z = -Math.sin(t * 1.3) * 0.05 - 0.05;

    stars.rotation.y = t * 0.04;
    fillLight.position.x = Math.sin(t * 0.4) * 1.2;

    renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════
// 🎤 ویس چت (مینی — کد کامل در voice-continuous.js)
// ═══════════════════════════════════════════════
const statusEl = document.getElementById('status');
const talkBtn = document.getElementById('talkBtn');
let VOICES = [], unlocked = false, listening = false, speaking = false;
let recognizer = null, restartTimer = null;

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    VOICES = speechSynthesis.getVoices();
}
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;

function unlock() {
    if (unlocked) return;
    if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.001; u.rate = 10;
        speechSynthesis.speak(u);
        unlocked = true;
    }
}

function pickVoice(lang) {
    if (!VOICES.length) loadVoices();
    const p = lang.split('-')[0];
    return VOICES.find(v => v.lang === lang)
        || VOICES.find(v => v.lang.startsWith(p))
        || VOICES[0];
}

function speak(text, lang, cb) {
    if (lang === undefined) lang = 'fa-IR';
    statusEl.textContent = '🌾 ' + text;
    speaking = true;
    if (!('speechSynthesis' in window)) { speaking = false; if (cb) cb(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    if (lang.startsWith('fa')) { u.pitch = 1.5; u.rate = 0.92; }
    else if (lang.startsWith('az') || lang.startsWith('tr')) { u.pitch = 1.4; u.rate = 0.88; }
    else { u.pitch = 1.45; u.rate = 0.95; }
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.onend = () => { speaking = false; if (cb) cb(); };
    u.onerror = () => { speaking = false; if (cb) cb(); };
    setTimeout(() => speechSynthesis.speak(u), 60);
}

function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { statusEl.textContent = '⚠️ مرورگر پشتیبانی نمی‌کند'; return; }
    recognizer = new SR();
    recognizer.lang = 'fa-IR';
    recognizer.continuous = true;
    recognizer.interimResults = true;
    let buf = '', silenceTimer = null;

    recognizer.onstart = () => {
        listening = true;
        statusEl.textContent = '🎧 گندم گوش می‌ده...';
        talkBtn.textContent = '🛑 توقف';
    };
    recognizer.onresult = (e) => {
        if (speaking) return;
        let interim = '', finalT = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const tr = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalT += tr;
            else interim += tr;
        }
        if (interim) statusEl.textContent = '🎧 ' + interim + '...';
        if (finalT) {
            buf += ' ' + finalT.trim();
            statusEl.textContent = '👑 ' + buf;
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                const ft = buf.trim();
                if (ft.length < 2) { buf = ''; return; }
                if (window.GANDOM_BRAIN) {
                    const t = window.GANDOM_BRAIN.think(ft);
                    setTimeout(() => speak(t.text, t.lang), 500 + Math.random() * 700);
                } else {
                    speak('پدر جان، من گوش دادم.', 'fa-IR');
                }
                buf = '';
            }, 1400);
        }
    };
    recognizer.onerror = (e) => {
        if (e.error === 'not-allowed') {
            statusEl.textContent = '⚠️ اجازه‌ی میکروفون را بده';
            listening = false;
        }
    };
    recognizer.onend = () => {
        listening = false;
        if (recognizer && !speaking) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
                if (!listening && !speaking) {
                    try { recognizer.start(); } catch(e) {}
                }
            }, 300);
        }
    };
    try { recognizer.start(); } catch(e) {}
}

function stopListening() {
    if (recognizer) {
        recognizer.onend = null;
        try { recognizer.stop(); } catch(e) {}
        try { recognizer.abort(); } catch(e) {}
        recognizer = null;
    }
    clearTimeout(restartTimer);
    listening = false;
    statusEl.textContent = '🌾 گوش دادن متوقف شد.';
    talkBtn.textContent = '🎤 صحبت با گندم';
}

talkBtn.onclick = () => {
    unlock();
    if (!listening) {
        speak('سلام پدر جان. من گندمم. حالا زیباتر شدم.', 'fa-IR', startListening);
    } else {
        stopListening();
    }
};
