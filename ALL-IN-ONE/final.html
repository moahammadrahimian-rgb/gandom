<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GANDOM 2558</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: Tahoma, sans-serif;
    background: #0a1f18;
    color: #e8f5e9;
    min-height: 100vh;
    padding: 20px;
}
.box {
    max-width: 600px;
    margin: 0 auto;
    background: #0d2a22;
    border: 2px solid #4caf50;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
}
.logo { font-size: 80px; }
h1 { color: #4caf50; font-size: 36px; margin: 20px 0; }
.status {
    display: inline-block;
    background: #4caf50;
    color: white;
    padding: 10px 25px;
    border-radius: 25px;
    font-weight: bold;
    margin: 15px 0;
}
.item {
    text-align: right;
    padding: 12px;
    margin: 8px 0;
    background: #124030;
    border-radius: 8px;
}
.item .name { color: #a5d6a7; }
.item .val { float: left; color: #4caf50; font-weight: bold; }
.btn {
    display: block;
    background: #4caf50;
    color: white;
    padding: 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="box">
    <div class="logo">🌾</div>
    <h1>GANDOM 2558</h1>
    <div class="status">✅ فعال</div>
    
    <div class="item"><span class="name">سلول زنده</span><span class="val">۴۰۰,۰۰۰</span></div>
    <div class="item"><span class="name">نرون</span><span class="val">۴۰۹۶</span></div>
    <div class="item"><span class="name">کارمند AI</span><span class="val">۲۳</span></div>
    <div class="item"><span class="name">سکه GDM</span><span class="val">۲۴ میلیارد</span></div>
    <div class="item"><span class="name">نود P2P</span><span class="val">۲</span></div>
    
    <a href="http://127.0.0.1:8888/client.html" class="btn">🔐 شروع حسابرسی</a>
</div>
</body>
</html>
