<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANDOM-AUDIT — آپلود فایل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #06100c, #0a1f18);
            color: #e8f5e9;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 40px auto; padding: 40px 20px; }
        h1 { text-align: center; color: #81c784; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #a5d6a7; margin-bottom: 30px; }
        .card {
            background: rgba(76, 175, 80, 0.1);
            border: 2px solid rgba(76, 175, 80, 0.3);
            border-radius: 16px;
            padding: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #81c784; margin-bottom: 8px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #e8f5e9;
            font-size: 16px;
        }
        input:focus, textarea:focus { outline: none; border-color: #4caf50; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4caf50, #388e3c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: none;
        }
        .price { color: #ffd54f; font-size: 24px; font-weight: bold; }
        .hash { font-family: monospace; font-size: 11px; color: #a5d6a7; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 GANDOM-AUDIT</h1>
        <p class="subtitle">حسابرسی در عرض چند ثانیه. با SHA256 اثبات کنید.</p>

        <div class="card">
            <div class="form-group">
                <label>نام شما</label>
                <input type="text" id="customer" placeholder="نام و نام خانوادگی">
            </div>
            <div class="form-group">
                <label>محتوای فایل (متن)</label>
                <textarea id="content" rows="6" placeholder="محتوای فایل خود را اینجا بنویسید..."></textarea>
            </div>
            <div class="form-group">
                <label>نام فایل</label>
                <input type="text" id="filename" placeholder="example.txt">
            </div>
            <button onclick="submitAudit()">🔐 شروع حسابرسی</button>

            <div id="result"></div>
        </div>
    </div>

    <script>
        async function submitAudit() {
            const customer = document.getElementById('customer').value || 'Anonymous';
            const content = document.getElementById('content').value;
            const filename = document.getElementById('filename').value || 'file.txt';

            if (!content) {
                alert('لطفاً محتوای فایل را وارد کنید');
                return;
            }

            // تبدیل به Base64
            const base64 = btoa(unescape(encodeURIComponent(content)));

            const payload = {
                customer: customer,
                files: [{ name: filename, content: base64 }]
            };

            try {
                const res = await fetch('http://127.0.0.1:8888/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = `
                    <h3 style="color:#4caf50; margin-bottom:15px;">✅ حسابرسی موفق</h3>
                    <p><strong>شناسه:</strong> ${data.id}</p>
                    <p><strong>مشتری:</strong> ${data.customer}</p>
                    <p><strong>تعداد فایل:</strong> ${data.total_files}</p>
                    <p><strong>هش فایل:</strong></p>
                    <p class="hash">${data.files[0].hash}</p>
                    <p style="margin-top:15px;"><strong>قیمت:</strong> <span class="price">${data.price.toLocaleString()} تومان</span></p>
                `;
            } catch (e) {
                alert('خطا در ارتباط با سرور: ' + e.message);
            }
        }
    </script>
</body>
</html>
