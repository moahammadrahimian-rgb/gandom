name: GANDOM Cloud Container Real Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  container-real-proof:
    name: GANDOM OCI Build Run Health Proof
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner Architecture
        run: |
          echo "=== RUNNER ==="
          uname -m
          getconf LONG_BIT
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "RUNNER_OS=${RUNNER_OS}"

      - name: Node Verification
        run: |
          node --version
          npm --version

      - name: Docker Verification
        run: |
          docker --version
          docker info --format \
            'SERVER={{.ServerVersion}} STORAGE={{.Driver}}'

      - name: Source Integrity
        run: |
          echo "=== SERVER HASH ==="
          sha256sum server.js

          echo "=== SERVER SYNTAX ==="
          node --check server.js

          echo "=== CAPACITOR CONFIG ==="
          cat capacitor.config.json

      - name: Build OCI Image
        run: |
          docker build \
            --pull \
            --tag gandom:cloud-proof \
            .

      - name: Verify Image
        run: |
          docker image inspect gandom:cloud-proof \
            --format 'IMAGE={{.Id}}'
          docker image inspect gandom:cloud-proof \
            --format 'SIZE={{.Size}}'

      - name: Start Real Container
        run: |
          docker run \
            --detach \
            --name gandom-cloud-proof \
            --publish 8787:8787 \
            --env PORT=8787 \
            gandom:cloud-proof

          sleep 5

      - name: Container Status
        run: |
          docker ps -a
          docker inspect gandom-cloud-proof \
            --format 'STATUS={{.State.Status}} EXIT={{.State.ExitCode}}'

      - name: Real Health Check
        run: |
          curl --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8787/health

          echo
          echo "CONTAINER_HEALTH=PASS"

      - name: Container Logs
        if: always()
        run: |
          docker logs gandom-cloud-proof || true

      - name: Runtime Evidence
        if: always()
        run: |
          mkdir -p evidence

          {
            echo "=== GANDOM CLOUD CONTAINER EVIDENCE ==="
            date -u
            echo
            echo "RUNNER_ARCH=$(uname -m)"
            echo "RUNNER_BITS=$(getconf LONG_BIT)"
            echo
            echo "DOCKER=$(docker --version)"
            echo
            docker ps -a
            echo
            docker inspect gandom-cloud-proof \
              --format 'STATUS={{.State.Status}} EXIT={{.State.ExitCode}}' \
              || true
            echo
            curl --silent http://127.0.0.1:8787/health \
              || true
            echo
            echo "=== SERVER HASH ==="
            sha256sum server.js
          } | tee evidence/GANDOM-CLOUD-CONTAINER-PROOF.txt

      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandom-cloud-container-proof
          path: evidence/GANDOM-CLOUD-CONTAINER-PROOF.txt
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          docker rm -f gandom-cloud-proof || true
