name: GANDOM UI Real E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ui-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Servers (Frontend & Backend)
        run: |
          # Start Frontend on 8080
          PORT=8080 nohup node gandom-ui-server.js > /tmp/gandom-frontend.log 2>&1 &
          
          # Start Backend API on 8787
          PORT=8787 nohup node server.js > /tmp/gandom-backend.log 2>&1 &
          
          # Wait for both PORTS to be open (Maximum 60 seconds)
          echo "Waiting for servers to be ready..."
          npx wait-on tcp:8080 tcp:8787 -t 60000

      - name: Run E2E Browser Test
        run: node archive/20261019-224013/test-ui-real-8080.js

      - name: Upload Evidence & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandom-ui-e2e-evidence
          path: |
            evidence/
            /tmp/gandom-frontend.log
            /tmp/gandom-backend.log
          if-no-files-found: ignore

