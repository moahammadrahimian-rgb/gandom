name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create www folder
      run: |
        mkdir -p www
        cp -r public/* www/ 2>/dev/null || true
        echo '<html><body>Gandom</body></html>' > www/index.html

    - name: Create package.json
      run: |
        echo '{"name":"gandom","version":"1.0.0","private":true}' > package.json

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create Config
      run: |
        echo '{"appId":"com.gandom.app","appName":"gandom","webDir":"www"}' > capacitor.config.json

    - name: Add Android
      run: npx cap add android

    - name: Sync
      run: npx cap sync android

    - name: Build
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gandom-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
