name: GANDOM Global Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  android-global-build:
    name: GANDOM Android x64 API36
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Runner Architecture
        run: |
          echo "===== RUNNER ====="
          uname -m
          getconf LONG_BIT
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "RUNNER_OS=${RUNNER_OS}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: |
          npm ci

      - name: Verify Capacitor
        run: |
          node -e "
          const p=require('./package.json');
          console.log('CAPACITOR_CORE='+(p.dependencies?.['@capacitor/core']||'MISSING'));
          console.log('CAPACITOR_ANDROID='+(p.dependencies?.['@capacitor/android']||'MISSING'));
          "

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Android Configuration
        run: |
          echo "===== SDK CONFIG ====="
          grep -RniE \
            'compileSdk|targetSdk|minSdk' \
            android/app/build.gradle \
            android/variables.gradle \
            android/build.gradle 2>/dev/null || true

          echo "===== APP ID ====="
          grep -RniE \
            'applicationId|namespace|versionCode|versionName' \
            android/app/build.gradle \
            android/build.gradle 2>/dev/null || true

          echo "===== CAPACITOR ====="
          cat capacitor.config.json

      - name: Verify Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify Outputs
        run: |
          echo "===== RELEASE OUTPUTS ====="
          find android/app/build/outputs \
            -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gandom-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gandom-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
